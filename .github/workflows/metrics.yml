name: Metrics
on:
  # Atualiza automaticamente todos os dias à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite que você rode a action manualmente clicando em um botão
  workflow_dispatch:
  # Atualiza sempre que você fizer um push no README
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          # Configurações gerais
          user: samuel-c-santos
          template: classic
          base: header, activity, community, metadata
          config_timezone: America/Belem
          config_locale: pt-BR

          # Plugin Isocalendar (calendário de contribuições)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Diminui um pouco a fonte
          extras_css: |
            svg { font-size: 12px; }
