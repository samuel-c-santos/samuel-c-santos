name: Metrics
on:
  # Atualiza automaticamente todos os dias à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite que você rode a action manualmente clicando em um botão
  workflow_dispatch:
  # Atualiza sempre que você fizer um push no README
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          # Configurações gerais
          user: samuel-c-santos
          template: classic
          base: header, activity, community, metadata
          config_timezone: America/Belem
          config_locale: pt-BR

          # Plugin Isocalendar (calendário de contribuições)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Diminui um pouco a fonte
          extras_css: |
            svg { font-size: 12px; }
            svg { background-color: #FDFAF3; color: #0A0A0A; }
            text { fill: #0A0A0A; }
            h1, h2, h3 { color: #0A0A0A !important; font-weight: 900; }
            .field, footer { color: #0A0A0A; }
            .field svg { fill: #0A0A0A; }
            :root {
              --color-calendar-graph-day-bg: #EFE8D6;
              --color-calendar-graph-day-border: rgba(10, 10, 10, 0.18);
              --color-calendar-graph-day-L1-bg: #FFE600;
              --color-calendar-graph-day-L2-bg: #FFC900;
              --color-calendar-graph-day-L3-bg: #FF9F1C;
              --color-calendar-graph-day-L4-bg: #FF4D4D;
            }
            rect.day[fill="#9be9a8"] { fill: #FFE600; }
            rect.day[fill="#40c463"] { fill: #FFC900; }
            rect.day[fill="#30a14e"] { fill: #FF9F1C; }
            rect.day[fill="#216e39"] { fill: #FF4D4D; }
            rect.day[fill="#ebedf0"] { fill: #EFE8D6; }
